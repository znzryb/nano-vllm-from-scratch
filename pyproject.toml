[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "nano-vllm-from-scratch"
version = "0.1.0"
description = "Build an LLM inference engine from scratch, with reproducible performance experiments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "torch>=2.6,<3",
    "transformers>=4.57,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nanovllm_scratch"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]
